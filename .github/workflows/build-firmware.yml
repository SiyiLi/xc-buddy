name: Build firmware

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/build-firmware.yml"

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build XC Buddy firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: esp32s3
          path: firmware
          command: |
            idf.py build
            mkdir -p ../dist
            cp build/xc_buddy.bin ../dist/xc-buddy-sticks3-ota.bin
            cd build
            esptool.py --chip esp32s3 merge_bin \
              -o ../../dist/xc-buddy-sticks3-merged.bin @flash_args

      - name: Write checksums
        run: |
          cd dist
          sha256sum xc-buddy-sticks3-ota.bin > xc-buddy-sticks3-ota.bin.sha256
          sha256sum xc-buddy-sticks3-merged.bin > xc-buddy-sticks3-merged.bin.sha256

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xc-buddy-sticks3-firmware
          path: dist/*

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xc-buddy"
version = "0.2.2"
description = "Linux desktop companion for the XC Buddy StickS3"
requires-python = ">=3.10"
dependencies = [
  "bleak>=0.22,<2",
  "dbus-fast>=5,<6",
  "tomli>=2,<3; python_version < '3.11'",
  "websockets>=12,<16",
]

[project.scripts]
xc-buddy = "app.app:main"

[tool.setuptools]
packages = ["app"]
include-package-data = false

[tool.setuptools.package-data]
app = ["icons/*.icns", "icons/*.png", "icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

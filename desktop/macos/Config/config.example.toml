# NVIDIA Inference audio via OpenAI-compatible chat completions + input_audio.
openai_base_url = "https://inference-api.nvidia.com/v1"
openai_api_key = "your_nvidia_inference_api_key"
openai_model = "gcp/google/gemini-3.6-flash"
openai_language = ""
openai_prompt = "Transcribe this audio accurately and verbatim. The speaker may mix Mandarin Chinese and English technical terms in the same sentence. Preserve each language, technical names, punctuation, and capitalization. Output transcript only."
llm_base_url = "https://api.openai.com/v1"
llm_api_key = "your_openai_compatible_llm_api_key"
llm_model = "gpt-5.5"
interaction_mode = "hold_to_talk"
asr_hotwords = "XC Buddy,Codex,OpenClaw,DiffAgent,DiffAgentPro,MagLev,MedChain,MATLAB,NVIDIA,Stargate,Overleaf,Feishu,Telegram,PyTorch,CUDA,checkpoint,dataloader,rollout"
paired_device_ids = ""
device_theme_colors = ""
device_overlay_positions = ""
auto_enter = true
debug_audio_cache = false
codex_bridge_port = 17321
codex_bridge_token = "replace-with-a-long-random-local-token"
codex_success_chime = true
relay_mode = "disabled"
relay_url = "wss://body.siyi.ai/xc-buddy/v1/stream"
relay_sender_token = "replace-with-sender-token"
relay_receiver_token = "replace-with-receiver-token"
display_dim_seconds = 30
display_off_seconds = 300
idle_deep_sleep_seconds = 300
codex_deep_sleep_seconds = 900
# debug_audio_dir = "~/Library/Application Support/XC Buddy/DebugAudio"

[output]
target = "focused_app"
transform = "original"
translation_target = "en"

# Optional per-device output overrides:
# [device.C3D8.output]
# transform = "translate"
# translation_target = "en"
#
# [device."09AF".output]
# transform = "translate"
# translation_target = "zh-Hans"
